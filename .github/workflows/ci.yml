name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Build and confirm the committed dist/ matches the source
        run: |
          npm run build
          git diff --exit-code -- dist || (echo "dist/ is stale: run npm run build and commit it" && exit 1)
