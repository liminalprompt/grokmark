name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches the package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json (${PKG_VERSION}) and manifest.json (${MANIFEST_VERSION})"
            exit 1
          fi
      - run: npm ci
      - run: npm run release:check
      - name: Zip the build without source maps
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          (cd dist && zip -qr "../grokmark-${VERSION}.zip" . -x "*.map")
          shasum -a 256 "grokmark-${VERSION}.zip" | tee SHA256SUMS.txt
      - name: Attest build provenance
        # GitHub only stores attestations for public repositories; until the repo is public this step is informational.
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: grokmark-*.zip
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SUM=$(cut -d' ' -f1 SHA256SUMS.txt)
          {
            echo "Built by GitHub Actions from the tagged source. See CHANGELOG.md."
            echo
            echo "SHA-256 of grokmark-${VERSION}.zip: \`${SUM}\`"
            echo
            echo "Verify: \`gh attestation verify grokmark-${VERSION}.zip --repo ${GITHUB_REPOSITORY}\`"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "grokmark-${VERSION}.zip" SHA256SUMS.txt --title "Grokmark ${VERSION}" --notes-file notes.md
